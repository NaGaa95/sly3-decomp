name: Progress graph

# Redraws docs/progress.svg from config/matched.csv on every push and commits it if it changed.
# Uses only committed files (no game data), so it runs on a plain GitHub runner.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/progress.svg'
      - 'config/progress_history.csv'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: progress-graph
  cancel-in-progress: false

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Redraw graph
        run: python tools/progress_graph.py
      - name: Commit if changed
        run: |
          git add docs/progress.svg config/progress_history.csv
          if git diff --cached --quiet; then echo "Graph unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update progress graph [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
